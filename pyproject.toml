[project]
name = "lego-spike"
version = "0.1.0"
description = "Multi-robot SIR agent-based simulation on LEGO SPIKE Prime hubs using Pybricks and connectionless BLE broadcasts"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "bleak>=3.1.0",
    "pybricksdev>=2.3.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["host", "robot", "shared"]

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "standard"
